# XcodeGen project definition for the Nature Explorer iOS app (docs/architecture.md §2/§3, research.md R9).
# Generate with `xcodegen generate` (the .xcodeproj is git-ignored). Feature code lives in local Swift packages
# under Packages/; the app target only wires them together.
name: NatureExplorer

options:
  # Bundle id prefix confirmed final by the owner on 2026-09-07 (matches PRODUCT_BUNDLE_IDENTIFIER below).
  bundleIdPrefix: com.natureexplorer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    CODE_SIGN_STYLE: Automatic
    # Owner sets the Apple Developer team id once the App ID exists (needed for device builds and TestFlight, T051).
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  H3Kit:
    path: Packages/H3Kit
  TerritoryRules:
    path: Packages/TerritoryRules
  DesignSystem:
    path: Packages/DesignSystem
  MapFeature:
    path: Packages/MapFeature
  # Feature 002 (research.md R11–R13): Core (session, models, validators), the generated client, three features.
  Core:
    path: Packages/Core
  APIClient:
    path: Packages/APIClient
  AuthFeature:
    path: Packages/AuthFeature
  FactionsFeature:
    path: Packages/FactionsFeature
  ProfileFeature:
    path: Packages/ProfileFeature

targets:
  NatureExplorer:
    type: application
    platform: iOS
    sources:
      - path: NatureExplorer
        excludes:
          - Info.plist
          - NatureExplorer.entitlements
      - path: Resources
        type: folder
        buildPhase: resources
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: H3Kit
      - package: TerritoryRules
      - package: DesignSystem
      - package: MapFeature
      - package: Core
      - package: APIClient
      - package: AuthFeature
      - package: FactionsFeature
      - package: ProfileFeature
    settings:
      base:
        # Final bundle identifier (owner confirmed 2026-09-07).
        PRODUCT_BUNDLE_IDENTIFIER: com.natureexplorer.app
        PRODUCT_NAME: NatureExplorer
        INFOPLIST_FILE: NatureExplorer/Info.plist
        # Sign in with Apple (feature 002, research.md R13); the App ID needs the capability too (owner action).
        CODE_SIGN_ENTITLEMENTS: NatureExplorer/NatureExplorer.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets:
        - NatureExplorerTests
      gatherCoverageData: true
      configVariants: []
      environmentVariables:
        # Set to a directory to make TerritoryRules-backed tests read fixtures from somewhere else.
        NATURE_FIXTURES_DIR: ""

  NatureExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NatureExplorerTests
    dependencies:
      - target: NatureExplorer
      - package: TerritoryRules
      - package: MapFeature
      - package: DesignSystem
      - package: Core
      - package: Core
        product: CoreTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natureexplorer.app.tests
        GENERATE_INFOPLIST_FILE: YES
