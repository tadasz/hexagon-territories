# SwiftLint configuration for apps/ios (run `swiftlint` from this directory; installed via `brew install swiftlint`).
included:
  - NatureExplorer
  - Tests
  - Packages/H3Kit/Sources/H3Kit
  - Packages/H3Kit/Tests
  - Packages/TerritoryRules
  - Packages/DesignSystem
  - Packages/MapFeature
excluded:
  - Packages/H3Kit/Sources/CH3     # vendored C
  - "**/.build"
  - "**/*.xcodeproj"
disabled_rules:
  - todo                            # TODO(owner) markers are intentional until the brand is named
  - trailing_comma                  # .swiftformat owns trailing commas
opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true
identifier_name:
  min_length: 1                     # x, y, t, k, a, b are natural in geometry code
  excluded: [id, r5, r6, r7, r8, r9, ts, tz]
type_name:
  excluded: [H3]
function_body_length:
  warning: 60
  error: 100
