# API, packages and Swift-package CI (specs/001-repo-foundations/tasks.md T027, research.md R8;
# specs/002-auth-and-factions/tasks.md T030).
#
# Validation note: GitHub Actions cannot run in the authoring container, so this workflow was
# validated by parsing it with `yq` and by checking every step against the documented inputs of
# actions/checkout@v4, pnpm/action-setup@v4 (reads `packageManager` from package.json),
# actions/setup-node@v4 (`cache: pnpm`), docker/setup-buildx-action@v3 and
# docker/build-push-action@v6 (`load: true` + `cache-from/to: type=gha`). The root
# pnpm-lock.yaml is committed (T043), so `pnpm install --frozen-lockfile` is the install step.
#
# Root scripts (package.json): `pnpm lint` = turbo lint + `prettier --check .`; `pnpm typecheck`;
# `pnpm test` = `SKIP_DB_TESTS=1 turbo run test` (unit only); `pnpm test:db` = turbo test with the
# DB integration suites (needs DATABASE_URL or Docker). The `api` job calls the package script
# directly with DATABASE_URL pointing at the image built from infra/docker/postgres. The auth
# variables (JWT_SECRET, APPLE_CLIENT_IDS, APPLE_JWKS_URL) are set by apps/api/test/helpers/app.ts,
# so no job exports them.
#
# `@nature/api-schema` (packages/*) devDepends on `@nature/api`: its snapshot test boots the API's
# `openapi:print`, so the `rules` job builds `@nature/api` and its workspace dependencies first
# (turbo's `test` task depends on `^build`, the explicit step makes the order visible in the log).
#
# The `swift` job runs `swift test` in every Swift package that builds on Linux inside the official
# swift:6.2.1 container (pinned; matches the toolchain recorded in apps/ios/VERIFY.md).
# macOS-only, NOT covered here: the app target `NatureExplorer` (xcodegen + xcodebuild), the
# `MapFeature` package (MapLibre iOS binary), and the SwiftUI / AuthenticationServices / Security
# sources of DesignSystem, AuthFeature, FactionsFeature and ProfileFeature, which sit behind
# `#if canImport(...)` and are only type-checked by Xcode Cloud (apps/ios/ci_scripts/ci_post_clone.sh).
name: api

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PG_IMAGE: nature-postgres:16-3.4-h3
  DATABASE_URL: postgres://nature:nature@localhost:5432/nature

jobs:
  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (every workspace) and Prettier
        run: pnpm lint
      - name: Build @nature/api and its dependencies (needed by the @nature/api-schema snapshot test)
        run: pnpm turbo run build --filter=@nature/api-schema...
      - name: Typecheck and test the shared packages (incl. the OpenAPI snapshot and its iOS copy)
        run: pnpm turbo run typecheck test --filter='./packages/*'

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Build nature-postgres:16-3.4-h3 (PostGIS + h3-pg)
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/postgres
          tags: ${{ env.PG_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=nature -e POSTGRES_PASSWORD=nature -e POSTGRES_DB=nature \
            -p 5432:5432 "$PG_IMAGE"
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -U nature -d nature >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker logs pg; exit 1

      - name: h3-pg smoke test
        run: |
          res=$(docker exec pg psql -U nature -d nature -tA -v ON_ERROR_STOP=1 \
            -c "select h3_get_resolution(h3_lat_lng_to_cell(point(23.9,54.9), 9))")
          echo "h3_get_resolution -> ${res}"
          test "$res" = "9"
          docker exec pg psql -U nature -d nature -tA -c "select postgis_version()"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@nature/api...
      - run: pnpm turbo run lint typecheck --filter=@nature/api
      - name: API tests (unit + integration against the built image)
        run: pnpm --filter @nature/api test

  swift:
    name: swift (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: swift:6.2.1-noble
    strategy:
      fail-fast: false
      matrix:
        # Linux-buildable packages only; see the header comment for what stays macOS-only.
        package:
          - H3Kit
          - TerritoryRules
          - Core
          - DesignSystem
          - AuthFeature
          - FactionsFeature
          - ProfileFeature
          - APIClient
    steps:
      - uses: actions/checkout@v4
      - name: swift --version
        run: swift --version
      - name: swift test
        working-directory: apps/ios/Packages/${{ matrix.package }}
        # APIClient resolves swift-openapi-generator/runtime/urlsession from GitHub and runs the
        # generator as a build plugin; its generated code carries the generator's own warnings, so it
        # is the one package built without -warnings-as-errors.
        run: |
          if [ "${{ matrix.package }}" = "APIClient" ]; then
            swift test
          else
            swift test -Xswiftc -warnings-as-errors
          fi
