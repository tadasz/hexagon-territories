# Local stack (docs/architecture.md §2 "Hosting"): Postgres+PostGIS+h3-pg, MinIO (S3 API) and the
# API. `make dev` starts postgres + minio + minio-init and runs the API from source with tsx;
# `docker compose -f infra/docker-compose.yml up` additionally builds and runs the API container.
#
# Validation note: the Docker daemon was not available in the authoring container, so this file
# was validated with `docker compose -f infra/docker-compose.yml config` (parses, four services)
# and by review of the image documentation (minio/minio and minio/mc release tags exist on Docker
# Hub; `mc ready local` is the documented MinIO healthcheck). First real run: Stream E (`make dev`).
name: nature

services:
  postgres:
    build:
      context: ./docker/postgres
    image: nature-postgres:16-3.4-h3
    environment:
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: nature
      POSTGRES_DB: nature
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP so the temporary initdb server (unix socket only) does not count as ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U nature -d nature']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: nature
      MINIO_ROOT_PASSWORD: naturenature
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: creates the media bucket and the 7-day lifecycle rule for export bundles
  # (specs/002-auth-and-factions/research.md R8), then exits 0. The production bucket needs the
  # same rule (plan.md "Owner actions").
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 nature naturenature
        mc mb --ignore-existing local/nature-media
        mc ilm rule ls local/nature-media --prefix exports/ 2>/dev/null | grep -q exports/ \
          || mc ilm rule add --expire-days 7 --prefix exports/ local/nature-media
        echo "bucket nature-media ready (exports/ expire after 7 days)"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: nature-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      DATABASE_URL: postgres://nature:nature@postgres:5432/nature
      LOG_LEVEL: info
      JOBS_ENABLED: 'true'
      # Feature 002: sessions, Sign in with Apple, account lifecycle. Dev-only secret; the
      # placeholder bundle id is replaced by the owner once the App ID exists.
      JWT_SECRET: dev-secret-dev-secret-dev-secret-0123
      APPLE_CLIENT_IDS: com.natureexplorer.app
      APPLE_JWKS_URL: https://appleid.apple.com/auth/keys
      AUTH_RATE_LIMIT_PER_MIN: '20'
      ACCOUNT_PURGE_GRACE_DAYS: '30'
      EXPORT_TTL_DAYS: '7'
      TRUST_PROXY: 'false'
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs are opened by the phone/browser, which reaches MinIO on the host port.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central-1
      S3_BUCKET: nature-media
      S3_ACCESS_KEY: nature
      S3_SECRET_KEY: naturenature
    # Apply migrations, then serve.
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/server.js']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres-data:
  minio-data:
